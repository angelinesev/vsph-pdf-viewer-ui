[build]
  command = "node scripts/write-portal-config.js && npm install"
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/lib/**"]

# Live APIs (Netlify Functions + server/lib)
[[redirects]]
  from = "/api/saas/*"
  to = "/.netlify/functions/saas/:splat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api-health"
  status = 200

[[redirects]]
  from = "/api/documents/prepare"
  to = "/.netlify/functions/api-documents-prepare"
  status = 200

[[redirects]]
  from = "/api/links"
  to = "/.netlify/functions/api-links"
  status = 200

[[redirects]]
  from = "/api/pdf-url/*"
  to = "/.netlify/functions/api-pdf-url/:splat"
  status = 200

[[redirects]]
  from = "/api/pdf/*"
  to = "/.netlify/functions/api-pdf/:splat"
  status = 200

[[redirects]]
  from = "/view/*"
  to = "/.netlify/functions/view/:splat"
  status = 200

# Portals live under /apps/* (relative shared assets require real paths)
[[redirects]]
  from = "/admin"
  to = "/apps/admin/"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/apps/admin/"
  status = 301

[[redirects]]
  from = "/developer"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/developer/"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/create"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/create/"
  to = "/apps/developer/"
  status = 301

# Keep static trees ahead of vanity catch-alls (files win unless force=true).
# Reserved prefixes are also blocked inside the vanity function.
[[redirects]]
  from = "/external/*"
  to = "/external/:splat"
  status = 200

[[redirects]]
  from = "/pdf-turn/*"
  to = "/pdf-turn/:splat"
  status = 200

# Public vanity share links: /{org}/{project} and /{org}/{project}/{brochure}
# Placed after /api, /view, /admin, /developer, /external, /pdf-turn rules
[[redirects]]
  from = "/:org/:project/:brochure"
  to = "/.netlify/functions/vanity"
  status = 200

[[redirects]]
  from = "/:org/:project"
  to = "/.netlify/functions/vanity"
  status = 200

