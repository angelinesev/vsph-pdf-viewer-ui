[build]
  command = "node scripts/write-portal-config.js && npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/lib/**"]

# Legacy Netlify API (kept during cutover; prefer Supabase Edge Functions)
[[redirects]]
  from = "/api/saas/*"
  to = "/.netlify/functions/saas/:splat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api-health"
  status = 200

[[redirects]]
  from = "/api/documents/prepare"
  to = "/.netlify/functions/api-documents-prepare"
  status = 200

[[redirects]]
  from = "/api/links"
  to = "/.netlify/functions/api-links"
  status = 200

[[redirects]]
  from = "/api/pdf-url/*"
  to = "/.netlify/functions/api-pdf-url/:splat"
  status = 200

[[redirects]]
  from = "/api/pdf/*"
  to = "/.netlify/functions/api-pdf/:splat"
  status = 200

[[redirects]]
  from = "/view/*"
  to = "/.netlify/functions/view/:splat"
  status = 200

# Portals live under /apps/* (relative shared assets require real paths)
[[redirects]]
  from = "/admin"
  to = "/apps/admin/"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/apps/admin/"
  status = 301

[[redirects]]
  from = "/developer"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/developer/"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/create"
  to = "/apps/developer/"
  status = 301

[[redirects]]
  from = "/create/"
  to = "/apps/developer/"
  status = 301
